<svg width="1200" height="620" viewBox="0 0 1200 620"
xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- Moving Rainbow Gradient -->
<linearGradient id="borderGradient"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%" stop-color="#00F7FF"/>
<stop offset="20%" stop-color="#7A5CFF"/>
<stop offset="40%" stop-color="#FF00E5"/>
<stop offset="60%" stop-color="#00F7FF"/>
<stop offset="80%" stop-color="#7A5CFF"/>
<stop offset="100%" stop-color="#00F7FF"/>

<animate
attributeName="x1"
values="0%;100%;0%"
dur="4s"
repeatCount="indefinite"/>

<animate
attributeName="x2"
values="100%;200%;100%"
dur="4s"
repeatCount="indefinite"/>

</linearGradient>


<!-- Glow Filter -->
<filter id="glow">

<feGaussianBlur
stdDeviation="8"
result="blur"/>

<feMerge>

<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

</defs>


<!-- Dark Background -->

<rect
x="15"
y="15"
width="1170"
height="590"
rx="35"
fill="#0d1117"
/>


<!-- BIG OUTER GLOW -->

<rect
x="15"
y="15"
width="1170"
height="590"
rx="35"
fill="none"
stroke="url(#borderGradient)"
stroke-width="14"
opacity="0.65"
filter="url(#glow)"
/>


<!-- MAIN BORDER -->

<rect
x="15"
y="15"
width="1170"
height="590"
rx="35"
fill="none"
stroke="url(#borderGradient)"
stroke-width="4"
/>


<!-- LEFT / RIGHT DIVIDER -->

<line
x1="650"
y1="55"
x2="650"
y2="565"
stroke="#30363d"
stroke-width="2"
/>


<!-- ABOUT ME TITLE -->

<text
x="55"
y="95"
fill="#ffffff"
font-size="32"
font-family="Arial, sans-serif"
font-weight="bold">

🌟 About Me

</text>


<!-- LEFT CONTENT -->

<text
x="55"
y="145"
fill="#ffffff"
font-size="21"
font-family="Arial, sans-serif">

<tspan x="55" dy="0">👨‍💻 Who Am I?</tspan>

<tspan x="55" dy="42">🎓 Computer Science Engineering Student</tspan>

<tspan x="55" dy="36">💻 Passionate about Web Development</tspan>

<tspan x="55" dy="36">🌱 Currently learning MERN Stack</tspan>

<tspan x="55" dy="36">🧠 Interested in Problem Solving &amp; DSA</tspan>

<tspan x="55" dy="36">🛠️ Interested in Open Source</tspan>

<tspan x="55" dy="36">📚 Always exploring new technologies</tspan>

<tspan x="55" dy="36">🚀 Love building real-world projects</tspan>

<tspan x="55" dy="36">⚡ Turning ideas into real-world projects</tspan>

</text>


<!-- CURRENT FOCUS -->

<text
x="55"
y="510"
fill="#00F7FF"
font-size="21"
font-family="Arial, sans-serif"
font-weight="bold">

🎯 Currently Focusing On

</text>


<!-- RIGHT SIDE -->

<text
x="920"
y="105"
text-anchor="middle"
fill="#ffffff"
font-size="28"
font-family="Arial, sans-serif"
font-weight="bold">

💻 Developer

</text>


<!-- Developer Icon -->

<circle
cx="920"
cy="270"
r="105"
fill="#161b22"
stroke="#30363d"
stroke-width="2"
/>


<text
x="920"
y="285"
text-anchor="middle"
font-size="110">

👨‍💻

</text>


<!-- RIGHT DESCRIPTION -->

<text
x="920"
y="430"
text-anchor="middle"
fill="#00F7FF"
font-size="22"
font-family="Arial, sans-serif"
font-weight="bold">

Code • Learn • Build

</text>


<text
x="920"
y="465"
text-anchor="middle"
fill="#ffffff"
font-size="19"
font-family="Arial, sans-serif">

Repeat 🚀

</text>


<!-- SMALL MOVING LIGHT -->

<circle
r="7"
fill="#ffffff"
filter="url(#glow)">

<animateMotion
dur="4s"
repeatCount="indefinite"
path="M 35,35 H 1165 V 585 H 35 Z"/>

</circle>


</svg>
